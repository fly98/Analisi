name: Deploy Clip Worker

on:
  push:
    paths:
      - 'clip_worker.js'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create wrangler config
        run: |
          cat > wrangler_clip_deploy.toml << 'TOML'
          name = "fly-clip"
          main = "clip_worker.js"
          compatibility_date = "2025-01-01"

          [[durable_objects.bindings]]
          name = "CLIP"
          class_name = "Clip"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["Clip"]
          TOML

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler_clip_deploy.toml
