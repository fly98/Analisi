name: Deploy HA Worker

on:
  push:
    paths:
      - 'ha_worker.js'
      - 'wrangler_ha.toml'
      - '.github/workflows/deploy-ha-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler_ha.toml

      # La chiave del ponte viene rimessa a ogni pubblicazione, cosi' non puo' piu' sparire.
      # Passo esplicito con --config: l'opzione "secrets" della action userebbe wrangler.toml
      # e caricherebbe la chiave sul worker sbagliato (little-shadow-145e).
      - name: Chiave del ponte (HA_API_KEY)
        run: echo "$HA_API_KEY" | npx --yes wrangler@3 secret put HA_API_KEY --config wrangler_ha.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}

      - name: Pulizia una tantum della chiave finita per errore su little-shadow-145e
        run: echo y | npx --yes wrangler@3 secret delete HA_API_KEY --name little-shadow-145e || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
