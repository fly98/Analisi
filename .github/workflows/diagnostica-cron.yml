name: Diagnostica cron Cloudflare (sola lettura)
on:
  workflow_dispatch:
jobs:
  elenco:
    runs-on: ubuntu-latest
    steps:
      - name: Cron trigger per ogni worker dell'account
        env:
          T: ${{ secrets.CF_API_TOKEN }}
          A: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" \
            | python3 -c "import sys,json; [print(s['id']) for s in json.load(sys.stdin).get('result',[])]" > nomi.txt
          while read n; do
            echo "== $n"
            curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/$n/schedules" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print([c['cron'] for c in (d.get('result') or {}).get('schedules',[])] or d.get('errors'))"
          done < nomi.txt
