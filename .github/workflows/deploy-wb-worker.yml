name: Deploy WB Worker

on:
  push:
    paths:
      - 'wb_worker.js'
      - 'wb_stats_schema.sql'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.WB_ANTHROPIC_API_KEY }}
      HAS_TM_KEY: ${{ secrets.TM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Create wrangler config
        run: |
          cat > wrangler_wb_deploy.toml << 'EOF'
          name = "wb-worker"
          main = "wb_worker.js"
          compatibility_date = "2024-09-23"

          [[kv_namespaces]]
          binding = "WB_KV"
          id = "6f30ec561fed4d4ca3398f699c08b37f"

          [[services]]
          binding = "TG"
          service = "tg-worker"

          [triggers]
          crons = ["0 5 * * *"]
          EOF

      - name: Database statistiche (D1) - crea se manca, aggiunge il collegamento e le tabelle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@3
          trova() { wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const x=a.find(d=>d.name==='wb-stats');console.log(x?(x.uuid||x.id||''):'')}catch(e){console.log('')}})"; }
          ID=$(trova)
          if [ -z "$ID" ]; then wrangler d1 create wb-stats; ID=$(trova); fi
          echo "ID database: $ID"
          if [ -z "$ID" ]; then echo "::error::Database D1 non creato: controllare i permessi D1 del token Cloudflare"; exit 1; fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "wb-stats"\ndatabase_id = "%s"\n' "$ID" >> wrangler_wb_deploy.toml
          cat wrangler_wb_deploy.toml
          wrangler d1 execute wb-stats --remote --config wrangler_wb_deploy.toml --file wb_stats_schema.sql

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config wrangler_wb_deploy.toml

      - name: Set admin key
        run: |
          npm install -g wrangler@3
          echo "${{ secrets.WB_ADMIN_KEY }}" | wrangler secret put WB_ADMIN_KEY --name wb-worker --config wrangler_wb_deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Anthropic key (once provided)
        if: ${{ env.HAS_ANTHROPIC_KEY != '' }}
        run: |
          npm install -g wrangler@3
          echo "${{ secrets.WB_ANTHROPIC_API_KEY }}" | wrangler secret put ANTHROPIC_API_KEY --name wb-worker --config wrangler_wb_deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Ticketmaster key (once provided)
        if: ${{ env.HAS_TM_KEY != '' }}
        run: |
          npm install -g wrangler@3
          echo "${{ secrets.TM_API_KEY }}" | wrangler secret put TM_API_KEY --name wb-worker --config wrangler_wb_deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set voce key
        run: |
          npm install -g wrangler@3
          echo "${{ secrets.VOCE_KEY }}" | wrangler secret put VOCE_KEY --name wb-worker --config wrangler_wb_deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
