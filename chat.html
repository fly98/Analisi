<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat ospiti · InternoUno</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="icons-arrivi/icon-180.png?v=1">
<meta name="theme-color" content="#f5f5f7">
<style>
  :root{
    --ink:#1d1d1f; --paper:#f5f5f7; --card:#fff; --line:#e3e3e6; --muted:#86868b;
    --terra:#c45a3a; --sage:#5c6b52; --in:#fff; --out:#dcf2d4;
    --sysfont:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sysfont);line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:inherit;}
  .top{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;}
  .top h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn{border:0;background:var(--ink);color:#fff;font:600 14px var(--sysfont);padding:9px 14px;border-radius:18px;cursor:pointer;}
  .btn.sec{background:#e9e9ec;color:var(--ink);}
  .btn:disabled{opacity:.5;}
  .wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px;}
  .scheda{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);font-size:14px;}
  .scheda .nome{font-weight:700;font-size:16px;}
  .scheda .riga{color:var(--muted);margin-top:2px;}
  .scheda .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{background:#f0f0f3;border-radius:12px;padding:3px 9px;font-size:13px;}
  .stato{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 10px;min-height:18px;}
  .stato.ko{color:#b3261e;} .stato.lavoro{color:var(--sage);}
  .giorno{text-align:center;margin:14px 0 6px;}
  .giorno span{background:#e9e9ec;color:#555;font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;}
  .b{max-width:82%;padding:7px 10px 5px;border-radius:14px;margin:3px 0;font-size:15.5px;word-wrap:break-word;overflow-wrap:anywhere;
     box-shadow:0 1px 1px rgba(0,0,0,.06);position:relative;}
  .b.in{background:var(--in);border-top-left-radius:4px;margin-right:auto;}
  .b.out{background:var(--out);border-top-right-radius:4px;margin-left:auto;}
  .b .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);margin-top:2px;}
  .b .lng{background:#0000000d;border-radius:6px;padding:0 5px;text-transform:uppercase;font-weight:600;}
  .b .orig{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed #00000022;font-size:14px;color:#555;}
  .b.apri .orig{display:block;}
  .b.tradotto{cursor:pointer;}
  .vuoto{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;}
  .elenco .c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;display:block;text-decoration:none;}
  .elenco .c .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;}
  .elenco .c .t small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;}
  .elenco .c .p{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barra{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.95);border-top:1px solid var(--line);
         padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;}
  .barra .btn{flex:1;max-width:340px;}
  @media (prefers-color-scheme:dark){
    :root{--ink:#f2f2f7;--paper:#000;--card:#1c1c1e;--line:#2c2c2e;--in:#262628;--out:#1f4d2b;--muted:#98989f;}
    .top,.barra{background:rgba(0,0,0,.85);} .chip,.btn.sec{background:#2c2c2e;color:var(--ink);}
    .btn{background:#f2f2f7;color:#000;} .giorno span{background:#2c2c2e;color:#bbb;} .b .orig{color:#bbb;}
  }
</style>
</head>
<body>
<div class="top">
  <button class="btn sec" id="indietro" style="display:none" onclick="location.href='chat.html'">‹</button>
  <h1 id="titolo">Chat ospiti</h1>
  <a class="btn sec" href="arrivi.html" style="text-decoration:none">Arrivi</a>
</div>
<div class="wrap">
  <div id="scheda"></div>
  <div class="stato" id="stato"></div>
  <div id="corpo"></div>
</div>
<div class="barra" id="barra" style="display:none">
  <button class="btn" id="agg" onclick="aggiorna()">Aggiorna messaggi</button>
  <a class="btn sec" id="waLink" style="text-decoration:none;text-align:center;display:none">Apri WhatsApp</a>
</div>

<script>
const WORKER = "https://little-shadow-145e.f-castiglioni.workers.dev";
const P = new URLSearchParams(location.search);
const BID = (P.get("b") || "").trim();
let TEL = (P.get("tel") || "").trim();
let BK = null;   // la prenotazione, se la trovo

// La chiave d'accesso e' la stessa dell'app Arrivi (localStorage 'arrivi_key'): mai scritta nel codice.
function chiave(){
  let k = ""; try{ k = localStorage.getItem("arrivi_key") || ""; }catch(e){}
  if(!k){ k = (prompt("Chiave d'accesso (la stessa di Arrivi):") || "").trim(); if(k){ try{ localStorage.setItem("arrivi_key", k); }catch(e){} } }
  return k;
}
async function api(query){
  const r = await fetch(`${WORKER}/?${query}&k=${encodeURIComponent(chiave())}`);
  if(r.status === 401){ try{ localStorage.removeItem("arrivi_key"); }catch(e){} throw new Error("chiave non valida: riapri la pagina e riscrivila"); }
  return r.json();
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stato(t, cls){ const e = document.getElementById("stato"); e.textContent = t || ""; e.className = "stato " + (cls || ""); }
const giornoBello = iso => { const d = new Date(iso.slice(0,10) + "T12:00:00"); return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}); };

// ---------- ELENCO CONVERSAZIONI ----------
async function elenco(){
  document.getElementById("titolo").textContent = "Chat ospiti";
  stato("Carico le conversazioni…", "lavoro");
  try{
    const d = await api("action=chatElenco");
    if(d.error){ stato(d.error, "ko"); return; }
    const c = d.conversazioni || [];
    stato("");
    document.getElementById("corpo").innerHTML = c.length
      ? '<div class="elenco">' + c.map(x => {
          const q = new URLSearchParams(); if(x.booking_id) q.set("b", x.booking_id); if(x.tel) q.set("tel", x.tel);
          return `<a class="c" href="chat.html?${q}"><div class="t"><span>${esc(x.tel ? "…" + x.tel.slice(-6) : "Prenotazione " + x.booking_id)}</span><small>${esc((x.ultimo||"").slice(5,16).replace("-","/"))}</small></div>
                  <div class="p">${x.ultima_dir === "out" ? "Tu: " : ""}${esc(x.anteprima)}</div></a>`; }).join("") + "</div>"
      : '<div class="vuoto">Nessuna conversazione salvata ancora.<br>Si riempie dalla prossima lettura WhatsApp (giro delle 3 o tasto 📱 in Arrivi).</div>';
  }catch(e){ stato(e.message, "ko"); }
}

// ---------- SCHEDA PRENOTAZIONE ----------
async function caricaScheda(){
  try{
    const d = await api("action=search&back=3&fwd=3");
    BK = (d.bookings || []).find(b => String(b.booking_id) === BID) || null;
  }catch(e){ BK = null; }
  const el = document.getElementById("scheda");
  if(!BK){ el.innerHTML = ""; return; }
  const bk = BK.booker || {};
  const nome = [bk.first_name, bk.last_name].filter(Boolean).join(" ") || "Ospite";
  const camere = (BK.rooms || []).map(r => r.individual_room_name).filter(Boolean).join(", ");
  if(!TEL) TEL = bk.phone || "";
  document.getElementById("titolo").textContent = nome;
  let orario = "", nota = "";
  try{
    const iso = (BK.checkin || "").slice(0,10);
    const [o, n] = await Promise.all([api(`action=getOrari&date=${iso}`), api(`action=getNote&date=${iso}`)]);
    orario = (o.orari || {})[BID] || ""; nota = (n.note || {})[BID] || "";
  }catch(e){}
  const t = BK.tassa || null;
  el.innerHTML = `<div class="scheda"><div class="nome">${esc(nome)}</div>
    <div class="riga">${esc(camere)}${camere ? " · " : ""}${esc((BK.checkin||"").slice(0,10))} → ${esc((BK.checkout||"").slice(0,10))} · ${esc(BK.adults||"")}👤 · ${esc(BK.source||"")}</div>
    <div class="chips">${orario ? `<span class="chip">🕐 ${esc(orario)}</span>` : ""}${nota ? `<span class="chip">📝 ${esc(nota)}</span>` : ""}
      ${t ? `<span class="chip">${t.pagata ? "💶 tassa pagata" : (t.link ? "💶 link tassa pronto" : "💶 tassa da fare")}</span>` : ""}
      ${TEL ? `<span class="chip">📱 ${esc(TEL)}</span>` : ""}</div></div>`;
  const w = document.getElementById("waLink");
  if(TEL.replace(/\D/g,"").length >= 9){ w.href = "whatsapp://send?phone=" + TEL.replace(/\s/g,"").replace("+",""); w.style.display = ""; }
}

// ---------- CHAT ----------
function bolla(m){
  const trad = m.testo_it && m.testo_it.trim();
  const mostrato = trad ? m.testo_it : m.testo;
  const ora = (m.ts || "").slice(11,16);
  const canale = m.canale === "whatsapp" ? "" : (m.canale === "airbnb" ? "Airbnb" : "Booking");
  return `<div class="b ${m.dir === "out" ? "out" : "in"}${trad ? " tradotto" : ""}" ${trad ? 'onclick="this.classList.toggle(\'apri\')"' : ""}>
    ${esc(mostrato)}
    ${trad ? `<div class="orig">${esc(m.testo)}</div>` : ""}
    <div class="meta">${trad ? `<span class="lng">${esc(m.lingua || "")}</span>` : ""}${canale ? `<span>${canale}</span>` : ""}<span>${m.ts_approx ? "~" : ""}${esc(ora)}</span></div></div>`;
}
async function carica(){
  stato("Carico la chat e traduco quello che manca…", "lavoro");
  try{
    const q = new URLSearchParams(); if(BID) q.set("bookingId", BID); if(TEL) q.set("tel", TEL);
    const d = await api("action=chat&" + q);
    if(d.error){ stato(d.error, "ko"); return; }
    const ms = d.messaggi || [];
    let html = "", ultimo = "";
    for(const m of ms){
      const g = (m.ts || "").slice(0,10);
      if(g && g !== ultimo){ html += `<div class="giorno"><span>${esc(giornoBello(g))}</span></div>`; ultimo = g; }
      html += bolla(m);
    }
    document.getElementById("corpo").innerHTML = html || '<div class="vuoto">Nessun messaggio salvato per questa prenotazione.<br>Premi «Aggiorna messaggi» per leggerli ora.</div>';
    stato(d.ancora_da_tradurre ? `${d.ancora_da_tradurre} messaggi ancora da tradurre: riapri tra poco.` : (ms.length ? "Tocca un messaggio tradotto per vedere l'originale." : ""),
          d.ancora_da_tradurre ? "ko" : "");
    window.scrollTo(0, document.body.scrollHeight);
  }catch(e){ stato(e.message, "ko"); }
}

// Rilegge WhatsApp (e Booking/Airbnb) dal Mac: ~20 secondi, il Mac deve essere acceso.
async function aggiorna(){
  const b = document.getElementById("agg"); b.disabled = true; b.textContent = "Leggo…";
  stato("Leggo i messaggi dal Mac… circa 20 secondi.", "lavoro");
  const esiti = [];
  try{
    if(TEL.replace(/\D/g,"").length >= 9){
      const d = await api(`action=whatsapp&bookingId=${encodeURIComponent(BID)}&tel=${encodeURIComponent(TEL)}&giorni=45&checkin=${encodeURIComponent(((BK&&BK.checkin)||"").slice(0,10))}`);
      if(d.wa_esito === "messaggi_da_sincronizzare") esiti.push("WhatsApp: apri l'app sul telefono qualche secondo e riprova.");
      else if(d.wa_esito === "errore" || d.error || d.wa_esito === "sessione_assente" || d.wa_esito === "browser_non_avviato" || d.wa_esito === "profilo_occupato")
        esiti.push("WhatsApp non riuscito: " + (d.wa_errore || d.error || d.wa_esito));
    }
    if(BK && /booking|airbnb/i.test(BK.source || "")){
      await api(`action=messaggi&bookingId=${encodeURIComponent(BID)}&source=${encodeURIComponent(BK.source)}&checkin=${encodeURIComponent((BK.checkin||"").slice(0,10))}&rileggi=1`).catch(() => null);
    }
  }catch(e){ esiti.push(e.message); }
  await carica();
  if(esiti.length) stato(esiti.join(" "), "ko");
  b.disabled = false; b.textContent = "Aggiorna messaggi";
}

(async function avvio(){
  if(!BID && !TEL){ elenco(); return; }
  document.getElementById("indietro").style.display = "";
  document.getElementById("barra").style.display = "";
  await caricaScheda();
  await carica();
})();
</script>
</body>
</html>
