<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatI1 · InternoUno</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatI1">
<link rel="manifest" href="manifest-chati1.json">
<link rel="apple-touch-icon" href="icons-chati1/icon-180.png?v=1">
<link rel="apple-touch-icon" sizes="512x512" href="icons-chati1/icon-512.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icons-chati1/icon-192.png?v=1">
<meta name="theme-color" content="#f0f2f5">
<style>
  :root{
    --ink:#111b21; --muted:#667781; --paper:#f0f2f5; --pannello:#fff; --line:#e9edef;
    --in:#fff; --out:#d9fdd3; --accent:#00a884; --sel:#f0f2f5; --chiaro:#eef1f4;
    --b1:#8fe3cf99; --b2:#a9bcff88; --b3:#ffc2dd77; --vin:#ffffff70; --vout:#7fe8c466; --vb:#ffffffb0; --vo:#2a405528; --vh:#ffffffd0; --vh2:#ffffff30; --g1:#ffffffcc; --g2:#ffffff33;
    --sysfont:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#e9edef;--muted:#8696a0;--paper:#0b141a;--pannello:#111b21;--line:#222d34;--in:#202c33;--out:#005c4b;--sel:#2a3942;--chiaro:#0b141a;
      --b1:#00a88444; --b2:#4a64e044; --b3:#c0407a33; --vin:#ffffff17; --vout:#00c08a55; --vb:#ffffff30; --vo:#00000066; --vh:#ffffff4d; --vh2:#ffffff10; --g1:#ffffff40; --g2:#ffffff0d;}
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sysfont);-webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font-family:inherit;}
  .app{display:grid;height:100%;grid-template-columns:340px minmax(0,1fr);background:var(--pannello);}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .col.lista{border-right:1px solid var(--line);}
  .col.dett{border-left:1px solid var(--line);background:var(--pannello);}
  .testa{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--paper);border-bottom:1px solid var(--line);min-height:58px;}
  .testa h1,.testa h2{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .testa small{display:block;font-weight:400;color:var(--muted);font-size:12px;}
  .ib{border:0;background:transparent;color:var(--ink);font-size:20px;width:36px;height:36px;border-radius:18px;cursor:pointer;flex:none;}
  .ib:active{background:var(--sel);} .ib:disabled{opacity:.4;}
  .btn{border:0;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:8px 14px;border-radius:18px;cursor:pointer;}
  .btn.sec{background:var(--sel);color:var(--ink);} .btn:disabled{opacity:.5;}
  .barra-lista{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
  .barra-lista select{border:1px solid var(--line);background:var(--pannello);color:var(--ink);border-radius:8px;padding:5px 6px;font-size:13px;}
  .scorri{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .conv{display:flex;gap:11px;padding:10px 12px;margin:3px 8px;border-radius:16px;cursor:pointer;align-items:center;}
  .conv:hover{background:var(--sel);}
  .conv.sel{background:var(--vin);box-shadow:inset 0 1px 0 var(--vh),0 4px 14px var(--vo);border:1px solid var(--vb);padding:9px 11px;}
  .av{width:44px;height:44px;border-radius:22px;background:#6b7c85;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;background-image:linear-gradient(160deg,#ffffff59,transparent 56%);box-shadow:inset 0 1px 0 #ffffff80,0 2px 7px #00000030;}
  .av.pr{flex-direction:column;gap:2px;line-height:1;background-color:var(--accent);} .av.pr b{font-size:1.05em;} .av.pr i{font-style:normal;font-size:.6em;font-weight:600;opacity:.92;}
  .conv .c{flex:1;min-width:0;}
  .conv .r1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15.5px;}
  .conv .r1 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .r1 small{font-weight:400;color:var(--muted);font-size:12px;flex:none;}
  .conv .r2{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .conv .pren{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:1px;}
  .msgs{flex:1;overflow-y:auto;padding:14px 6% 18px;-webkit-overflow-scrolling:touch;
    background:radial-gradient(55% 38% at 12% 8%,var(--b1),transparent 72%),radial-gradient(48% 40% at 92% 34%,var(--b2),transparent 72%),
      radial-gradient(60% 46% at 28% 96%,var(--b3),transparent 72%),var(--chiaro);}
  .giorno{text-align:center;margin:12px 0 6px;} .giorno span{background:var(--pannello);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px #0000001a;}
  /* vetro liquido: sfondo che sfuma, bordo di luce, riflesso diagonale in alto */
  .b{max-width:78%;padding:9px 13px 6px;border-radius:20px;margin:8px 0;font-size:15px;line-height:1.38;overflow-wrap:anywhere;width:fit-content;
    border:1px solid var(--vb);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
    box-shadow:0 8px 22px var(--vo),inset 0 1.5px 0 var(--vh),inset 0 -1px 0 var(--vh2);}
  .b.in{margin-right:auto;border-bottom-left-radius:6px;
    background:linear-gradient(158deg,var(--g1) 0%,var(--g2) 26%,transparent 46%),var(--vin);}
  .b.out{margin-left:auto;border-bottom-right-radius:6px;
    background:linear-gradient(202deg,var(--g1) 0%,var(--g2) 26%,transparent 46%),var(--vout);}
  .b .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);margin-top:1px;}
  .b{position:relative;} .b.conrea{margin-bottom:20px;}
  .b .rp{font-size:12px;color:var(--muted);margin-right:auto;opacity:.85;} .b .rp svg{width:13px;height:13px;vertical-align:-2px;}
  .b .rea{position:absolute;bottom:-15px;padding:1px 7px;border-radius:12px;font-size:13px;line-height:1.5;border:1px solid var(--vb);
    background:var(--vin);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:0 3px 9px var(--vo),inset 0 1px 0 var(--vh);}
  .b.in .rea{left:12px;} .b.out .rea{right:12px;}
  .b .fl{font-size:14px;line-height:1;cursor:pointer;}
  .b.tr{cursor:pointer;}
  .b .orig{display:none;margin-top:5px;padding-top:5px;border-top:1px dashed #00000026;font-size:13.5px;color:var(--muted);}
  .b.apri .orig{display:block;}
  .b .cn{font-size:10.5px;font-weight:700;color:var(--accent);margin-right:auto;}
  .prog{padding:8px 14px 10px;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;}
  .prog .pt{color:var(--ink);line-height:1.35;} .prog .ps{color:var(--muted);font-size:12px;margin-top:2px;}
  .prog .pb{height:5px;border-radius:3px;background:var(--sel);margin-top:6px;overflow:hidden;} .prog .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .8s linear;}
  .compo{background:var(--paper);border-top:1px solid var(--line);padding:8px 12px 4px;}
  .compo .ant{display:none;margin-bottom:8px;padding:10px 12px;border-radius:16px;border:1px solid var(--vb);background:var(--vout);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 6px 18px var(--vo),inset 0 1px 0 var(--vh);font-size:14.5px;line-height:1.4;}
  .compo .ant.on{display:block;} .compo .ant .et{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .compo .ant .sig{margin-top:7px;padding-top:7px;border-top:1px dashed #00000026;color:var(--muted);font-size:13px;}
  .compo .ant .az{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  .compo .riga{display:flex;gap:8px;align-items:flex-end;}
  .compo textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--pannello);color:var(--ink);border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;line-height:1.35;max-height:140px;outline:none;}
  .compo .lg{flex:none;border:1px solid var(--line);background:var(--pannello);color:var(--ink);border-radius:18px;height:38px;padding:0 10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;position:relative;}
  .compo .lg select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;}
  .conv .r1 .fl2{font-size:12px;margin-left:5px;font-weight:400;}
  .stato{font-size:13px;text-align:center;color:var(--muted);padding:6px 12px;min-height:30px;background:var(--paper);border-top:1px solid var(--line);}
  .stato.ko{color:#c0392b;} .stato.lavoro{color:var(--accent);}
  .piede{display:flex;gap:8px;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);}
  .vuoto{color:var(--muted);text-align:center;padding:50px 24px;font-size:15px;line-height:1.5;}
  .det{padding:14px;font-size:14px;overflow-y:auto;}
  .det .nome{font-size:18px;font-weight:700;} .det .sub{color:var(--muted);margin-top:2px;}
  .det .sez{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .det .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .chip{display:inline-block;background:var(--sel);border-radius:12px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px;}
  .det a.btn{display:inline-block;text-decoration:none;margin-top:10px;margin-right:6px;}
  .solo-mobile{display:none;}
  /* box prenotazione in cima alla conversazione */
  .pbox{background:var(--paper);border-bottom:1px solid var(--line);font-size:13.5px;}
  .pbox .riga{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 14px;cursor:pointer;}
  .pbox .riga .fr{margin-left:auto;color:var(--muted);transition:transform .15s;} .pbox.apri .fr{transform:rotate(180deg);}
  .pbox .corpo{display:none;padding:2px 14px 12px;border-top:1px solid var(--line);}
  .pbox.apri .corpo{display:block;}
  .pbox .corpo .sez{margin-top:9px;} .pbox .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
  .pbox .chip{margin:0;}
  .conv .r3{color:var(--accent);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* telefono: una colonna alla volta */
  @media (max-width:760px){
    .app{grid-template-columns:100%;}
    .col.lista,.col.chat{display:none;}
    body.vl .col.lista{display:flex;} body.vc .col.chat{display:flex;}
    .msgs{padding:8px 10px;} .b{max-width:86%;}
  }
  @media (min-width:761px){ .solo-telefono{display:none;} }
</style>
</head>
<body class="vl">
<div class="app">

  <!-- colonna 1: conversazioni -->
  <section class="col lista">
    <div class="testa"><h1>ChatI1<small id="sottoLista"></small></h1>
      <button class="ib" id="bAggElenco" title="Leggi le chat recenti da WhatsApp" onclick="aggiornaElenco()">⟳</button>
      <a class="ib" href="arrivi.html" title="Torna ad Arrivi" style="text-decoration:none;display:flex;align-items:center;justify-content:center">🏠</a>
    </div>
    <div class="barra-lista">Ultimi
      <select id="selGiorni" onchange="cambiaGiorni()"><option value="1">1 giorno</option><option value="3" selected>3 giorni</option><option value="7">7 giorni</option><option value="30">30 giorni</option><option value="0">tutte</option></select>
      <span id="contaConv"></span></div>
    <div class="prog" id="prog" style="display:none"><div class="pt" id="progT"></div><div class="ps" id="progS"></div><div class="pb"><i id="progB"></i></div></div>

  <!-- colonna 2: messaggi -->
  <section class="col chat">
    <div class="testa">
      <button class="ib solo-telefono" onclick="vista('l')">‹</button>
      <div class="av" id="avTesta" style="width:38px;height:38px;font-size:14px;display:none"></div>
      <h2 id="titolo">Seleziona una conversazione</h2>
    </div>
    <div class="pbox" id="pbox" style="display:none"></div>
    <div class="msgs" id="msgs"><div class="vuoto">Scegli una conversazione a sinistra.<br>I messaggi sono sempre in italiano: tocca una bolla con la bandierina per vedere l'originale.</div></div>

        <textarea id="bozza" rows="1" placeholder="Scrivi in italiano: lo traduco prima dell'invio" oninput="this.style.height='auto';this.style.height=Math.min(140,this.scrollHeight)+'px'"></textarea>
        <button class="btn" id="bTrad" onclick="traduciBozza()">Traduci</button>
      </div>
    </div>
    <div class="piede" id="piede" style="display:none">
      <button class="btn sec" id="bAggChat" onclick="aggiornaChat()">Aggiorna questa chat</button>
      <a class="btn" id="bWa" style="text-decoration:none">Scrivi su WhatsApp</a>
    </div>
  </section>

</div>

<script>
const WORKER = "https://little-shadow-145e.f-castiglioni.workers.dev";
const P = new URLSearchParams(location.search);
let CONV = [];            // conversazioni dell'elenco
let SEL = null;           // conversazione aperta
let PRENOTAZIONI = null;  // bookings da Arrivi (solo lettura), caricate una volta
let MAPTEL = {};          // ultime 9 cifre -> prenotazioni

const FLAG = {it:"🇮🇹",en:"🇬🇧",es:"🇪🇸",fr:"🇫🇷",de:"🇩🇪",pt:"🇵🇹",zh:"🇨🇳",ru:"🇷🇺",ja:"🇯🇵",ko:"🇰🇷",pl:"🇵🇱",nl:"🇳🇱",ar:"🇸🇦",tr:"🇹🇷",sv:"🇸🇪",da:"🇩🇰",no:"🇳🇴",nb:"🇳🇴",fi:"🇫🇮",cs:"🇨🇿",ro:"🇷🇴",hu:"🇭🇺",el:"🇬🇷",uk:"🇺🇦",he:"🇮🇱",hi:"🇮🇳",th:"🇹🇭",vi:"🇻🇳",id:"🇮🇩",ca:"🇪🇸",hr:"🇭🇷",sk:"🇸🇰",bg:"🇧🇬"};
const LNG = {it:"italiano",en:"inglese",es:"spagnolo",fr:"francese",de:"tedesco",pt:"portoghese",zh:"cinese",ru:"russo",ja:"giapponese",ko:"coreano",pl:"polacco",nl:"olandese",ar:"arabo",tr:"turco",sv:"svedese",da:"danese",no:"norvegese",fi:"finlandese",cs:"ceco",ro:"rumeno",hu:"ungherese",el:"greco",uk:"ucraino",he:"ebraico",hi:"hindi",th:"thailandese",vi:"vietnamita",id:"indonesiano",ca:"catalano",hr:"croato",sk:"slovacco",bg:"bulgaro"};

// La chiave e' quella di Arrivi (localStorage 'arrivi_key'): mai scritta nel codice.
function chiave(){
  let k=""; try{k=localStorage.getItem("arrivi_key")||"";}catch(e){}
  if(!k){ k=(prompt("Chiave d'accesso (la stessa di Arrivi):")||"").trim(); if(k){try{localStorage.setItem("arrivi_key",k);}catch(e){}} }
  return k;
}
async function api(q){
  const r=await fetch(`${WORKER}/?${q}&k=${encodeURIComponent(chiave())}`);
  if(r.status===401){ try{localStorage.removeItem("arrivi_key");}catch(e){} throw new Error("chiave non valida: riapri la pagina e riscrivila"); }
  return r.json();
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t9=t=>{const c=String(t||"").replace(/\D/g,"");return c.length>=9?c.slice(-9):"";};
function stato(id,t,cls){const e=document.getElementById(id);e.textContent=t||"";e.className="stato "+(cls||"");}
function vista(v){document.body.classList.remove("vl","vc","vd");document.body.classList.add("v"+v);if(v==="d")document.body.classList.add("vc");}
function telCompleto(c){
  if(!c||!c.tel)return"";
  if(c.tel_completo)return c.tel_completo;
  const l=MAPTEL[t9(c.tel)];                       // numero completo dalla prenotazione, se c'e'
  if(l&&l.length){const bk=l[0].booker||{};const d=String(bk.phone||bk.mobile||"").replace(/\D/g,"");if(d.length>=10)return d.replace(/^00/,"");}
  return"";
}
function telMostra(c){const f=telCompleto(c);return f?"+"+f:(c&&c.tel?"…"+c.tel:"");}
function infoPren(c){          // prenotazione piu' vicina a oggi per questo numero (se in Arrivi)
  const l=c&&c.tel?(MAPTEL[t9(c.tel)]||[]):[]; if(!l.length)return null;
  const oggi=Date.now(); const b=l.slice().sort((x,y)=>Math.abs(new Date(x.checkin)-oggi)-Math.abs(new Date(y.checkin)-oggi))[0];
  const camera=(b.rooms||[]).map(r=>r.individual_room_name).filter(Boolean).join(", ");
  const d1=new Date((b.checkin||"").slice(0,10)+"T12:00:00"), d2=new Date((b.checkout||"").slice(0,10)+"T12:00:00");
  const m=x=>x.toLocaleDateString("it-IT",{month:"short"}).replace(".","");
  const date=isNaN(d1)?"":(isNaN(d2)?`${d1.getDate()} ${m(d1)}`:(d1.getMonth()===d2.getMonth()?`${d1.getDate()}–${d2.getDate()} ${m(d1)}`:`${d1.getDate()} ${m(d1)} – ${d2.getDate()} ${m(d2)}`));
  return {b,lista:l,camera,date};
}
function nomeConv(c){return c.nome||(c.tel?telMostra(c):(c.booking_id?"Prenotazione "+c.booking_id:"?"));}
const NUMP={uno:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};
function sigla(nome){const n=String(nome||"").trim(); const m=n.match(/\d+/); if(m)return m[0];
  for(const w of n.toLowerCase().split(/\s+/))if(NUMP[w])return String(NUMP[w]); return n.charAt(0).toUpperCase()||"?";}
function avatarDi(c){      // con prenotazione: camera (sopra) e data di arrivo (sotto); senza: il segnaposto di prima
  const ip=infoPren(c); if(!ip)return {cls:"",html:esc(iniziali(c))};
  const st=(ip.b.rooms||[]).map(r=>r.individual_room_name).filter(Boolean);
  const d=new Date((ip.b.checkin||"").slice(0,10)+"T12:00:00");
  return {cls:" pr",html:`<b>${esc(st.length?sigla(st[0])+(st.length>1?"+":""):"–")}</b><i>${isNaN(d)?"":d.getDate()+"/"+(d.getMonth()+1)}</i>`};
}
function iniziali(c){const n=c.nome||"";const m=n.match(/[A-Za-zÀ-ÿ]/g);return m?(m[0]+(n.split(/\s+/)[1]||"").charAt(0)).toUpperCase():"#";}
function chiaveConv(c){return c.tel||("b"+c.booking_id);}
function quandoBreve(ts){
  if(!ts)return""; const d=new Date(ts.replace(" ","T")+":00"); const oggi=new Date();
  const g=x=>x.toISOString?new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime():0;
  const diff=Math.round((g(oggi)-g(d))/86400000);
  if(diff===0)return ts.slice(11,16); if(diff===1)return"Ieri";
  if(diff<7)return d.toLocaleDateString("it-IT",{weekday:"short"}); return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
}

// ---------- elenco ----------
async function caricaElenco(){
  const g=document.getElementById("selGiorni").value;
  stato("statoLista","Carico…","lavoro");
  try{
    const d=await api("action=chatElenco&giorni="+g);
    if(d.error){stato("statoLista",d.error,"ko");return;}
    CONV=d.conversazioni||[]; stato("statoLista","");
    if(SEL){const n=CONV.find(x=>chiaveConv(x)===chiaveConv(SEL)); if(n){ if(!n.lingua&&SEL.lingua)n.lingua=SEL.lingua; SEL=n;
      const ch=document.getElementById("lgChip"); if(ch)ch.textContent=n.lingua?`${FLAG[n.lingua]||"🌐"} ${LNG[n.lingua]||n.lingua}`:"🌐 Scegli lingua";
      const ls=document.getElementById("lgSel"); if(ls)ls.value=n.lingua||""; }}
    disegnaElenco();
  }catch(e){stato("statoLista",e.message,"ko");}
}
function cambiaGiorni(){caricaElenco();}
function disegnaElenco(){

  const el=document.getElementById("elenco");
  if(!CONV.length){
    el.innerHTML='<div class="vuoto">Nessuna conversazione in questo periodo.<br><br>Premi ⟳ in alto per leggere le chat recenti da WhatsApp (serve il Mac acceso, il primo giro è il più lungo, poi legge solo le novità).</div>';
    return;

  el.innerHTML=CONV.map(c=>{

// ---------- conversazione ----------
async function apri(k){
  const c=CONV.find(x=>chiaveConv(x)===k); if(!c)return;
  SEL=c; disegnaElenco(); vista("c");
  document.getElementById("titolo").textContent=nomeConv(c);
  const av=document.getElementById("avTesta"); av.style.display="flex"; {const a=avatarDi(c); av.className="av"+a.cls; av.innerHTML=a.html;}
  document.getElementById("piede").style.display="flex";
  disegnaCompo(c);
  const w=document.getElementById("bWa");
  {const f=telCompleto(c); if(f){w.href="whatsapp://send?phone="+f; w.style.display="";} else w.style.display="none";}
  document.getElementById("bAggChat").style.display=c.tel?"":"none";
  try{history.replaceState(null,"","chati1.html?"+(c.tel?"tel="+c.tel:"b="+c.booking_id));}catch(e){}
  disegnaDettagli(c);
  await caricaMessaggi(c,0);
}
async function caricaMessaggi(c,tentativo){
  if(tentativo===0){stato("stato","Carico e traduco…","lavoro");}
  const q=new URLSearchParams(); if(c.tel)q.set("tel",c.tel); if(c.booking_id)q.set("bookingId",c.booking_id);
  try{
    const d=await api("action=chat&"+q);
    if(!SEL||chiaveConv(SEL)!==chiaveConv(c))return;   // nel frattempo ne hai aperta un'altra
    if(d.error){stato("stato",d.error,"ko");return;}
    if(d.tel_completo&&!c.tel_completo){c.tel_completo=d.tel_completo;document.getElementById("titolo").textContent=nomeConv(c);disegnaElenco();disegnaDettagli(c);const w=document.getElementById("bWa");w.href="whatsapp://send?phone="+d.tel_completo;w.style.display="";}
    if(d.nome&&!c.nome){c.nome=d.nome;document.getElementById("titolo").textContent=nomeConv(c);disegnaElenco();}
    disegnaMessaggi(d.messaggi||[]);
    if(d.ancora_da_tradurre>0&&tentativo<5){stato("stato",`Traduco… ancora ${d.ancora_da_tradurre} messaggi`,"lavoro");setTimeout(()=>caricaMessaggi(c,tentativo+1),600);}
    else stato("stato",d.ancora_da_tradurre?`${d.ancora_da_tradurre} messaggi ancora da tradurre: riapri tra poco.`:((d.messaggi||[]).length?"":"Nessun messaggio salvato: premi «Aggiorna questa chat»."),d.ancora_da_tradurre?"ko":"");
  }catch(e){stato("stato",e.message,"ko");}
}
function bolla(m){
  const trad=m.testo_it&&m.testo_it.trim()&&m.lingua&&m.lingua!=="it";
  const lng=m.lingua||"";
  const nome=LNG[lng]||lng;
  const tip=m.dir==="out"?`Inviato in ${nome} · tocca per vedere il testo inviato`:`Scritto in ${nome} · tocca per vedere l'originale`;
  const can=m.canale==="whatsapp"?"":(m.canale==="airbnb"?"Airbnb":"Booking");
  const rea=(m.reazioni||"").trim();
  return `<div class="b ${m.dir==="out"?"out":"in"}${trad?" tr":""}${rea?" conrea":""}" ${trad?`onclick="this.classList.toggle('apri')" title="${esc(tip)}"`:""}>
    ${can?`<div class="cn">${can}</div>`:""}${esc(trad?m.testo_it:m.testo)}
    ${trad?`<div class="orig">${FLAG[lng]||"🌐"} ${esc(m.testo)}</div>`:""}
    ${rea?`<span class="rea" title="Reazione al messaggio">${esc(rea)}</span>`:""}
    <div class="meta">${m.risposta?`<span class="rp" title="Risposta a un messaggio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/></svg></span>`:""}${trad?`<span class="fl">${FLAG[lng]||"🌐"}</span>`:""}<span>${m.ts_approx?"~":""}${esc((m.ts||"").slice(11,16))}</span></div></div>`;
}
function disegnaMessaggi(ms){
  let h="",ult="";
  for(const m of ms){
    const g=(m.ts||"").slice(0,10);
    if(g&&g!==ult){ult=g;h+=`<div class="giorno"><span>${esc(new Date(g+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}))}</span></div>`;}
    h+=bolla(m);
  }
  const box=document.getElementById("msgs");
  box.innerHTML=h||'<div class="vuoto">Nessun messaggio salvato per questa conversazione.<br>Premi «Aggiorna questa chat» per leggerlo da WhatsApp.</div>';
  box.scrollTop=box.scrollHeight;
}

async function caricaPrenotazioni(){
  try{
    const d=await api("action=search&back=2&fwd=3");
    PRENOTAZIONI=d.bookings||[];
    MAPTEL={};
    for(const b of PRENOTAZIONI){
      const bk=b.booker||{}; const k=t9(bk.phone||bk.mobile||"");
      if(k)(MAPTEL[k]=MAPTEL[k]||[]).push(b);
    }
    disegnaElenco(); if(SEL)disegnaDettagli(SEL);
  }catch(e){PRENOTAZIONI=[];}
}

// ---------- aggiornamento incrementale a 3 fasi, con tempi ----------
let AGG=false, TICK=null, PROG={t0:0,resto:0,inizio:0};
function prog(testo,resto){            // resto = secondi stimati da qui alla fine di TUTTO l'aggiornamento
  const box=document.getElementById("prog"); box.style.display="";
  document.getElementById("progT").textContent=testo;
  PROG.inizio=Date.now(); PROG.resto=resto;
  if(!PROG.t0)PROG.t0=Date.now();
  if(!TICK)TICK=setInterval(tickProg,1000); tickProg();
}
function tickProg(){
  const tot=Math.round((Date.now()-PROG.t0)/1000), passo=Math.round((Date.now()-PROG.inizio)/1000);
  const resto=Math.max(0,PROG.resto-passo);
  document.getElementById("progS").textContent=`${tot} s trascorsi · `+(resto>0?`ancora circa ${resto<60?resto+" s":Math.ceil(resto/60)+" min"}`:"ancora un attimo…");
  document.getElementById("progB").style.width=Math.min(97,Math.round(100*tot/(tot+resto+1)))+"%";
}
function fineProg(){
  if(TICK){clearInterval(TICK);TICK=null;} PROG.t0=0;
  document.getElementById("prog").style.display="none";
}
async function traduciElenco(conProg){
  const dt=CONV.filter(c=>c.da_tradurre>0&&(c.tel||c.booking_id));
  let fatte=0;
  for(const c of dt){
    fatte++;
    if(conProg)prog(`Fase 3 di 3 · traduco in italiano (${fatte} di ${dt.length}): ${nomeConv(c)}`,6*(dt.length-fatte+1));
    else stato("statoLista",`Traduco in sottofondo… ${fatte} di ${dt.length}`,"lavoro");
    const q=c.tel?"tel="+encodeURIComponent(c.tel):"bookingId="+encodeURIComponent(c.booking_id);
    for(let t=0;t<6;t++){
      const d=await api("action=chatTraduci&"+q).catch(()=>null);
      if(!d||d.error||!d.ancora)break;
    }
  }
  if(dt.length){await caricaElenco(); if(SEL){const c=CONV.find(x=>chiaveConv(x)===chiaveConv(SEL)); if(c)caricaMessaggi(c,0);}}
  if(!conProg&&dt.length)stato("statoLista","");
}
const AGG_KEY="chati1_aggiornamento";
function salvaAgg(st){ st.agg=Date.now(); try{localStorage.setItem(AGG_KEY,JSON.stringify(st));}catch(e){} }
function cancAgg(){ try{localStorage.removeItem(AGG_KEY);}catch(e){} }
function leggiAgg(){ try{const x=JSON.parse(localStorage.getItem(AGG_KEY)||"null"); if(x&&Date.now()-(x.agg||0)<20*60000)return x;}catch(e){} return null; }
const pausa=ms=>new Promise(r=>setTimeout(r,ms));

function aggiornaElenco(){
  if(AGG)return;
  const g=Math.min(parseInt(document.getElementById("selGiorni").value,10)||3,30);
  eseguiAgg({g,t0:Date.now(),fase:1,coda:[],inVolo:[],tentativi:{},totale:0,fatte:0,nuovi:0,letteOk:0,prob:0,falliti:[],nell:0,inv:0,LOTTO:3},false);
}
// lo stato vive nel browser: se ricarichi la pagina il lavoro riparte da dove era arrivato
async function eseguiAgg(st,ripresa){
  if(AGG)return; AGG=true;
  const b=document.getElementById("bAggElenco"); b.disabled=true; stato("statoLista","");
  PROG.t0=st.t0;
  try{
    if(ripresa&&(st.fase===1||(st.inVolo&&st.inVolo.length))){
      // la richiesta lasciata a meta' puo' essere ancora in corso sul Mac: le do il tempo di finire
      prog("Riprendo l'aggiornamento: aspetto che il Mac finisca la lettura in corso",30);
      await pausa(15000);
      if(st.inVolo&&st.inVolo.length){ st.inVolo.forEach(t=>{st.tentativi[t]=Math.max(0,(st.tentativi[t]||1)-1);}); st.coda.unshift(...st.inVolo); st.inVolo=[]; }
    }
    if(st.fase===1){
      // fase 1: solo l'elenco; il Mac non apre nessuna chat
      prog("Fase 1 di 3 · controllo su WhatsApp quali chat hanno novità",45);
      const e=await api("action=chatElencoWa&giorni="+st.g);
      if(e.esito!=="ok")throw new Error("Lettura dell'elenco non riuscita: "+(e.errore||e.error||e.esito)+(e.esito==="profilo_occupato"?" (riprova tra un minuto)":""));
      st.coda=(e.da_leggere||[]).slice(); st.totale=st.coda.length; st.nell=e.nell_elenco||0; st.inv=e.invariate||0; st.fase=2; salvaAgg(st);
    }
    if(st.fase===2){
      // fase 2: solo le chat cambiate, a piccoli lotti (la richiesta non deve superare i 100 s)
      while(st.coda.length){
        const lotto=st.coda.splice(0,st.LOTTO);
        lotto.forEach(t=>st.tentativi[t]=(st.tentativi[t]||0)+1);
        st.inVolo=lotto; salvaAgg(st);
        const stima=Math.ceil((st.coda.length+lotto.length)/3)*30+20;
        prog(`Fase 2 di 3 · leggo le chat con novità (${Math.min(st.fatte+1,st.totale)}–${Math.min(st.fatte+lotto.length,st.totale)} di ${st.totale})`,stima);
        let d=null;
        try{ d=await api("action=chatLeggiTitoli&giorni="+st.g+"&t="+encodeURIComponent(JSON.stringify(lotto))); }catch(er){ d={esito:"errore",errore:er.message}; }
        st.inVolo=[];
        if(d.esito!=="ok"){
          // il Mac e' rimasto indietro o occupato: pausa e riprovo queste chat una per volta (una sola volta)
          prog("Il Mac non ha risposto in tempo: aspetto qualche secondo e riprovo",25+stima);
          await pausa(20000);
          for(const t of lotto){ if(st.tentativi[t]<2)st.coda.unshift(t); else st.falliti.push(t); }
          st.LOTTO=1; salvaAgg(st); continue;
        }
        for(const x of (d.chat||[])){ st.nuovi+=x.nuovi||0; if(x.esito==="letta")st.letteOk++; else st.prob++; }
        for(const x of (d.saltate||[])){
          if(!lotto.includes(x.titolo))continue;
          if(x.motivo==="tempo_esaurito"&&st.tentativi[x.titolo]<3)st.coda.push(x.titolo);
          else if(x.motivo==="bloccata"&&st.tentativi[x.titolo]<2)st.coda.push(x.titolo);
          else if(x.motivo!=="gruppo")st.falliti.push(x.titolo);
        }
        st.fatte+=lotto.length;
        if(d.troncato&&st.LOTTO>1)st.LOTTO=2;
        salvaAgg(st);
      }
      st.fase=3; salvaAgg(st);
    }
    await caricaElenco();
    // fase 3: traduzione di quello che manca
    await traduciElenco(true);
    fineProg(); cancAgg();
    const base=st.totale?`${st.letteOk} chat con novità lette, ${st.nuovi} messaggi nuovi.`:`Nessuna novità: ${st.nell} chat già aggiornate.`;
    const dubbi=st.prob+st.falliti.length;
    stato("statoLista",base+(st.inv&&st.totale?` ${st.inv} invariate saltate.`:"")+(dubbi?` ${dubbi} da controllare${st.falliti.length?" (non lette: ripremi ⟳ per riprovarle)":""}.`:""),dubbi?"ko":"");
    if(SEL){const k=chiaveConv(SEL);const c=CONV.find(x=>chiaveConv(x)===k); if(c)await caricaMessaggi(c,0);}
  }catch(err){fineProg();cancAgg();stato("statoLista",err.message,"ko"); await caricaElenco().catch(()=>{});}
  b.disabled=false; AGG=false;
}

(async function avvio(){
  await caricaElenco();
  caricaPrenotazioni();   // in parallelo: non blocca l'elenco
  {const st=leggiAgg(); if(st){eseguiAgg(st,true);} else traduciElenco(false);}   // aggiornamento lasciato a meta': riparte da dove era. Altrimenti traduce in sottofondo
  // chat salvate ma mai aperte: le traduce subito, cosi' anche le anteprime sono in italiano
  const t=P.get("tel"), b=P.get("b");
  if(t||b){
    let c=CONV.find(x=>t?t9(x.tel)===t9(t):String(x.booking_id)===b);
    if(!c&&t){   // conversazione piu' vecchia dell'elenco: provo con tutte
      document.getElementById("selGiorni").value="0"; await caricaElenco();
      c=CONV.find(x=>t9(x.tel)===t9(t));
    }
    if(c)apri(chiaveConv(c)); else stato("statoLista","Nessuna conversazione salvata per questo numero.","ko");
  }
