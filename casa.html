header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}

#sheet h2{margin:0 0 2px;font-size:19px}
#sheet .sub{color:var(--soft);font-size:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{flex:1 1 auto;min-width:88px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#f7f3ec;font:600 15px -apple-system,sans-serif;color:var(--ink)}
.btn.on{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.cold{background:var(--cold);border-color:var(--cold);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
input[type=range]{width:100%;height:36px;accent-color:var(--warm)}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.15);display:none}
#scrim.open{display:block}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);background:#23262d;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#unlock{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#unlock.open{display:flex}
#unlock form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:360px;width:100%}
#unlock h2{margin:0 0 6px}#unlock p{color:var(--soft);margin:0 0 14px;font-size:14px}
#unlock input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:16px;margin-bottom:10px}
.dev{cursor:pointer}
.spin{animation:gira 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

.lab{font-size:13px;color:var(--soft);margin:2px 0 2px;display:flex;justify-content:space-between}
input.hue{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin:10px 0 14px}
input.ct{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:linear-gradient(90deg,#ffb35c,#fff4e0,#cfe3ff);margin:10px 0 14px}
input.hue::-webkit-slider-thumb,input.ct::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #555;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tast .btn{min-width:0;font-size:20px;padding:12px 0;margin:0}.tast .btn[data-a=key]{font-size:14px}
