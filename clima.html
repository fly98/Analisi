<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clima Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110e; --stone: #2a2622; --stone-2: #3a352f; --line: #4a443c;
    --limestone: #e8e0d4; --ochre: #c9a15e; --patina: #7c9a82; --muted: #9a9184;
    --cool: #6ba3c9; --warm: #d98b5f; --off: #6a645c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--limestone); padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; color: var(--ochre); margin: 0 0 2px; }
  .sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }
  .card { background: var(--stone); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; color: var(--ochre); margin: 0 0 12px; }

  /* Termostato principale */
  .thermo { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .thermo-temp { text-align: center; }
  .big-temp { font-family: 'Fraunces', serif; font-size: 3.2rem; font-weight: 700; line-height: 1; }
  .big-temp span { font-size: 1.3rem; color: var(--muted); }
  .current-temp { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .temp-btns { display: flex; flex-direction: column; gap: 10px; }
  .rbtn { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); background: var(--stone-2); color: var(--limestone); font-size: 1.6rem; cursor: pointer; display:flex; align-items:center; justify-content:center; }
  .rbtn:active { background: var(--ochre); color: #241a12; }

  /* Griglia info */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-box { background: var(--stone-2); border-radius: 10px; padding: 10px 12px; }
  .info-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .info-value { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; margin-top: 2px; }
  .info-value small { font-size: 0.7rem; color: var(--muted); font-family: 'Inter'; }

  /* Controlli generici */
  .ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(74,68,60,0.4); gap: 12px; }
  .ctrl-row:last-child { border-bottom: none; }
  .ctrl-label { font-size: 0.9rem; }
  .ctrl-label small { display:block; font-size:0.7rem; color:var(--muted); }

  /* Toggle switch */
  .toggle { width: 48px; height: 28px; border-radius: 14px; background: var(--off); position: relative; cursor: pointer; flex-shrink:0; transition: background .2s; border:none; }
  .toggle.on { background: var(--patina); }
  .toggle::after { content:''; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:3px; left:3px; transition: left .2s; }
  .toggle.on::after { left:23px; }
  .toggle:disabled, .toggle.disabled { opacity: 0.35; pointer-events: none; }

  /* Select come pill scroll */
  .pill-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar { display:none; }
  .pill { flex-shrink:0; background: var(--stone-2); border:1px solid var(--line); color:var(--limestone); padding:7px 12px; border-radius:10px; font-size:0.78rem; cursor:pointer; white-space:nowrap; }
  .pill.active { background: var(--ochre); color:#241a12; border-color:var(--ochre); font-weight:600; }
  .ctrl-block { padding: 10px 0; border-bottom: 1px solid rgba(74,68,60,0.4); }
  .ctrl-block:last-child { border-bottom:none; }
  .ctrl-block .ctrl-label { margin-bottom: 6px; }
  .disabled-block { opacity: 0.35; pointer-events: none; }

  /* Modalità principale (mode chips) */
  .mode-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .mode-chip { flex:1; min-width:60px; text-align:center; background:var(--stone-2); border:1px solid var(--line); color:var(--limestone); padding:10px 6px; border-radius:10px; font-size:0.78rem; cursor:pointer; }
  .mode-chip.active { background:var(--cool); color:#0e1a20; border-color:var(--cool); font-weight:600; }

  /* Preset */
  .preset-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .preset-tab { flex:1; text-align:center; background:var(--stone-2); border:1px solid var(--line); color:var(--limestone); padding:12px 6px; border-radius:12px; font-size:0.8rem; cursor:pointer; font-weight:500; }
  .preset-tab.active { background:var(--ochre); color:#241a12; border-color:var(--ochre); font-weight:700; }
  .preset-actions { display:flex; gap:10px; margin-top:14px; }
  .act-btn { flex:1; padding:13px; border-radius:11px; border:none; font-size:0.9rem; font-weight:600; cursor:pointer; font-family:'Inter'; }
  .act-attiva { background: var(--patina); color:#12180f; }
  .act-salva { background: rgba(201,161,94,0.16); color:var(--ochre); border:1px solid var(--ochre); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--patina); color:#12180f; padding:12px 20px; border-radius:12px; font-weight:600; font-size:0.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9999; }
  .toast.show { opacity:1; }
  .status-line { font-size:0.72rem; color:var(--muted); text-align:center; margin-top:8px; }
  .warn { color: var(--warm); font-size:0.72rem; margin-top:6px; }
  .off-badge { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--patina); margin-left:6px; vertical-align:middle; }
  .off-badge.bad { background:var(--warm); }
</style>
</head>
<body>
<h1>Clima Camera</h1>
<div class="sub">Condizionatore camera da letto · <span id="conn">—</span></div>

<!-- SEZIONE INFO -->
<div class="card">
  <div class="card-title">Stato</div>
  <div class="info-grid">
    <div class="info-box"><div class="info-label">Temp. ambiente</div><div class="info-value" id="i-current">—<small>°C</small></div></div>
    <div class="info-box"><div class="info-label">Consumo oggi</div><div class="info-value" id="i-consumo">—<small>kWh</small></div></div>
    <div class="info-box"><div class="info-label">Corrente</div><div class="info-value" id="i-corrente">—<small>mA</small></div></div>
    <div class="info-box"><div class="info-label">Diagnostica</div><div class="info-value" id="i-diag" style="font-size:0.95rem;padding-top:6px;">—</div></div>
  </div>
</div>

<!-- TERMOSTATO -->
<div class="card">
  <div class="thermo">
    <div class="temp-btns">
      <button class="rbtn" onclick="stepTemp(1)">+</button>
      <button class="rbtn" onclick="stepTemp(-1)">−</button>
    </div>
    <div class="thermo-temp">
      <div class="big-temp"><span id="t-target">—</span><span>°C</span></div>
      <div class="current-temp" id="t-mode">—</div>
    </div>
    <div style="width:54px"></div>
  </div>
  <div style="margin-top:14px">
    <div class="ctrl-label" style="margin-bottom:8px">Modalità</div>
    <div class="mode-chips" id="mode-chips"></div>
  </div>
</div>

<!-- CONTROLLI COMPLETI -->
<div class="card" id="controls-card">
  <div class="card-title">Controlli</div>
  <div id="controls-container"></div>
  <div class="warn" id="ai-warn" style="display:none">⚠️ Con l'AI attiva, alcuni controlli sono gestiti automaticamente e disattivati.</div>
</div>

<!-- PRESET -->
<div class="card">
  <div class="card-title">Preset</div>
  <div class="preset-tabs" id="preset-tabs"></div>
  <div id="preset-detail" class="sub" style="margin-bottom:0">Seleziona un preset per vederne i parametri.</div>
  <div class="preset-actions">
    <button class="act-btn act-attiva" onclick="attivaPreset()">▶ Attiva</button>
    <button class="act-btn act-salva" onclick="salvaPreset()">💾 Salva</button>
  </div>
  <div class="status-line" id="preset-status"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://ha-worker.f-castiglioni.workers.dev'
const BASE = 'camera_da_letto_condizionatore_camera'
const CLIMATE = 'climate.' + BASE

// Definizione controlli
const SWITCHES = [
  { id:'ai', label:'AI', sub:'Regolazione automatica intelligente' },
  { id:'riposo', label:null }, // riposo è select, gestito a parte
  { id:'silenzioso', label:'Silenzioso', sub:'Ventola a basso rumore' },
  { id:'eco', label:'Eco', sub:'Risparmio energetico' },
  { id:'super', label:'Super', sub:'Massima potenza (turbo)' },
  { id:'dimmer', label:'Dimmer', sub:'Attenua display unità' },
  { id:'oscillazione_verticale', label:'Oscillazione verticale' },
  { id:'oscillazione_orizzontale', label:'Oscillazione orizzontale' },
  { id:'purificatore_dell_aria', label:'Purificatore aria' },
  { id:'aria_fresca', label:'Aria fresca', sub:'Ricambio aria' },
  { id:'protezione_antigelo', label:'Protezione antigelo' },
]
const SELECTS = [
  { id:'riposo', label:'Riposo (notte)', opts:['off','general','for_old','for_young','for_kid'], labels:{off:'Off',general:'Standard',for_old:'Anziani',for_young:'Adulti',for_kid:'Bimbi'} },
  { id:'ai_ventilazione', label:'AI ventilazione', opts:['off','follow','not_follow'], labels:{off:'Off',follow:'Segue',not_follow:'Non segue'} },
  { id:'compensazione_temperatura', label:'Compensazione temp.', opts:['offset_minus_3','offset_minus_2','offset_minus_1','offset_0','offset_plus_1','offset_plus_2','offset_plus_3'], labels:{offset_minus_3:'-3',offset_minus_2:'-2',offset_minus_1:'-1',offset_0:'0',offset_plus_1:'+1',offset_plus_2:'+2',offset_plus_3:'+3'} },
]
const MODES = [
  {v:'off',l:'Spento'},{v:'cool',l:'Freddo'},{v:'heat',l:'Caldo'},{v:'dry',l:'Deumid.'},{v:'fan_only',l:'Ventola'},{v:'auto',l:'Auto/AI'}
]
const FAN_MODES = { key:'fan_mode', label:'Velocità ventola', opts:['auto','low','middle_low','medium','middle_high','high'], labels:{auto:'Auto',low:'Bassa',middle_low:'Med-bassa',medium:'Media',middle_high:'Med-alta',high:'Alta'} }

// Controlli che l'AI disabilita
const AI_LOCKS = ['silenzioso','eco','super','riposo','fan_mode']

let STATE = {}   // ultimi stati letti
let targetTemp = 24
let currentMode = 'off'

// ---- Chiamate worker ----
async function callService(domain, service, entity_id, data) {
  const body = { domain, service, entity_id }
  if (data) body.data = data
  try {
    const r = await fetch(WORKER + '/call', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    return r.ok
  } catch(e) { return false }
}
async function fetchStates() {
  try {
    const r = await fetch(WORKER + '/states')
    const all = await r.json()
    const map = {}
    all.forEach(e => { if (e.entity_id.includes(BASE)) map[e.entity_id] = e })
    return map
  } catch(e) { return null }
}

function sw(id){ return 'switch.'+BASE+'_'+id }
function sel(id){ return 'select.'+BASE+'_'+id }

// ---- Rendering ----
function renderControls() {
  const c = document.getElementById('controls-container')
  const aiOn = STATE[sw('ai')] && STATE[sw('ai')].state === 'on'
  document.getElementById('ai-warn').style.display = aiOn ? 'block' : 'none'
  let html = ''

  // Velocità ventola (select da climate attribute)
  const climate = STATE[CLIMATE]
  const fanMode = climate ? climate.attributes.fan_mode : null
  const fanLocked = aiOn && AI_LOCKS.includes('fan_mode')
  html += `<div class="ctrl-block ${fanLocked?'disabled-block':''}"><div class="ctrl-label">${FAN_MODES.label}</div><div class="pill-row">`
  FAN_MODES.opts.forEach(o => {
    html += `<div class="pill ${fanMode===o?'active':''}" onclick="setFan('${o}')">${FAN_MODES.labels[o]}</div>`
  })
  html += `</div></div>`

  // Selects
  SELECTS.forEach(s => {
    const cur = STATE[sel(s.id)] ? STATE[sel(s.id)].state : null
    const locked = aiOn && AI_LOCKS.includes(s.id)
    html += `<div class="ctrl-block ${locked?'disabled-block':''}"><div class="ctrl-label">${s.label}</div><div class="pill-row">`
    s.opts.forEach(o => {
      html += `<div class="pill ${cur===o?'active':''}" onclick="setSelect('${s.id}','${o}')">${s.labels[o]||o}</div>`
    })
    html += `</div></div>`
  })

  // Switches
  SWITCHES.filter(s=>s.label).forEach(s => {
    const on = STATE[sw(s.id)] && STATE[sw(s.id)].state === 'on'
    const locked = aiOn && AI_LOCKS.includes(s.id)
    html += `<div class="ctrl-row ${locked?'disabled-block':''}"><div class="ctrl-label">${s.label}${s.sub?`<small>${s.sub}</small>`:''}</div><button class="toggle ${on?'on':''} ${locked?'disabled':''}" onclick="toggleSwitch('${s.id}')"></button></div>`
  })

  c.innerHTML = html
}

function renderMode() {
  const climate = STATE[CLIMATE]
  currentMode = climate ? climate.state : 'off'
  const chips = document.getElementById('mode-chips')
  chips.innerHTML = MODES.map(m => `<div class="mode-chip ${currentMode===m.v?'active':''}" onclick="setMode('${m.v}')">${m.l}</div>`).join('')
  document.getElementById('t-mode').textContent = MODES.find(m=>m.v===currentMode)?.l || currentMode
}

function renderInfo() {
  const climate = STATE[CLIMATE]
  if (climate) {
    targetTemp = climate.attributes.temperature || targetTemp
    document.getElementById('t-target').textContent = targetTemp
    document.getElementById('i-current').innerHTML = (climate.attributes.current_temperature ?? '—') + '<small>°C</small>'
  }
  const cons = STATE['sensor.'+BASE+'_consumo_energetico_giornaliero']
  const corr = STATE['sensor.'+BASE+'_elettricita']
  if (cons) document.getElementById('i-consumo').innerHTML = parseFloat(cons.state).toFixed(2) + '<small>kWh</small>'
  if (corr) document.getElementById('i-corrente').innerHTML = corr.state + '<small>mA</small>'

  // diagnostica: conta i guasti attivi
  let faults = 0
  Object.keys(STATE).forEach(k => {
    if (k.startsWith('binary_sensor.'+BASE) && STATE[k].state === 'on') faults++
  })
  const diag = document.getElementById('i-diag')
  diag.innerHTML = faults === 0 ? 'OK <span class="off-badge"></span>' : `${faults} avvisi <span class="off-badge bad"></span>`
}

function renderAll() {
  renderInfo(); renderMode(); renderControls()
}

// ---- Azioni ----
async function stepTemp(d) {
  const climate = STATE[CLIMATE]
  const min = climate?.attributes.min_temp ?? 16
  const max = climate?.attributes.max_temp ?? 32
  let t = (climate?.attributes.temperature ?? targetTemp) + d
  t = Math.max(min, Math.min(max, t))
  targetTemp = t
  document.getElementById('t-target').textContent = t
  await callService('climate','set_temperature',CLIMATE,{temperature:t})
  scheduleRefresh()
}
async function setMode(m) {
  await callService('climate','set_hvac_mode',CLIMATE,{hvac_mode:m})
  toast('Modalità: '+(MODES.find(x=>x.v===m)?.l||m))
  scheduleRefresh()
}
async function setFan(o) {
  await callService('climate','set_fan_mode',CLIMATE,{fan_mode:o})
  scheduleRefresh()
}
async function setSelect(id,o) {
  await callService('select','select_option',sel(id),{option:o})
  scheduleRefresh()
}
async function toggleSwitch(id) {
  const on = STATE[sw(id)] && STATE[sw(id)].state === 'on'
  await callService('switch', on?'turn_off':'turn_on', sw(id))
  scheduleRefresh()
}

// ---- Preset ----
const PRESETS = [
  { id:'condizionatore_notte', name:'Notte' },
  { id:'aria_camera_1', name:'Aria 1' },
  { id:'aria_camera_2', name:'Aria 2' },
  { id:'aria_camera_3', name:'Aria 3' },
]
let selectedPreset = null
let presetConfigs = {}  // id -> lista azioni lette

function renderPresetTabs() {
  document.getElementById('preset-tabs').innerHTML = PRESETS.map(p =>
    `<div class="preset-tab ${selectedPreset===p.id?'active':''}" onclick="selectPreset('${p.id}')">${p.name}</div>`
  ).join('')
}
async function selectPreset(id) {
  selectedPreset = id
  renderPresetTabs()
  const detail = document.getElementById('preset-detail')
  detail.textContent = 'Carico...'
  try {
    const r = await fetch(WORKER + '/script?id=' + id)
    const cfg = await r.json()
    presetConfigs[id] = cfg
    // Mostro cosa fa il preset in forma leggibile
    let lines = []
    ;(cfg.sequence||[]).forEach(step => {
      if (step.action === 'climate.set_hvac_mode') lines.push('Modalità → ' + (MODES.find(m=>m.v===step.data.hvac_mode)?.l||step.data.hvac_mode))
      else if (step.action === 'climate.set_temperature') lines.push('Temperatura → ' + step.data.temperature + '°C')
      else if (step.action === 'climate.set_fan_mode') lines.push('Ventola → ' + (FAN_MODES.labels[step.data.fan_mode]||step.data.fan_mode))
      else if (step.action === 'select.select_option') {
        const which = step.target.entity_id.replace('select.'+BASE+'_','')
        const sdef = SELECTS.find(s=>s.id===which)
        lines.push((sdef?sdef.label:which) + ' → ' + (sdef&&sdef.labels[step.data.option] ? sdef.labels[step.data.option] : step.data.option))
      }
      else if (step.action === 'switch.turn_on') lines.push((step.target.entity_id.replace('switch.'+BASE+'_','').replace(/_/g,' ')) + ' → ON')
      else if (step.action === 'switch.turn_off') lines.push((step.target.entity_id.replace('switch.'+BASE+'_','').replace(/_/g,' ')) + ' → OFF')
    })
    detail.innerHTML = lines.length ? lines.map(l=>'• '+l).join('<br>') : 'Preset vuoto'
  } catch(e) {
    detail.textContent = 'Errore caricamento preset'
  }
}
async function attivaPreset() {
  if (!selectedPreset) { toast('Seleziona un preset'); return }
  await callService('script', selectedPreset)
  toast('Preset attivato: ' + PRESETS.find(p=>p.id===selectedPreset).name)
  document.getElementById('preset-status').textContent = 'Attivato alle ' + new Date().toLocaleTimeString('it-IT')
  scheduleRefresh(1500)
}
async function salvaPreset() {
  if (!selectedPreset) { toast('Seleziona un preset'); return }
  // Salva = registra lo STATO ATTUALE del condizionatore come nuovo contenuto del preset
  if (!confirm('Salvare la configurazione ATTUALE del condizionatore dentro il preset "'+PRESETS.find(p=>p.id===selectedPreset).name+'"?')) return
  const climate = STATE[CLIMATE]
  const seq = []
  seq.push({ action:'climate.set_hvac_mode', target:{entity_id:CLIMATE}, data:{hvac_mode:climate.state} })
  if (climate.state !== 'off') {
    seq.push({ action:'climate.set_temperature', target:{entity_id:CLIMATE}, data:{temperature:climate.attributes.temperature} })
    if (climate.attributes.fan_mode) seq.push({ action:'climate.set_fan_mode', target:{entity_id:CLIMATE}, data:{fan_mode:climate.attributes.fan_mode} })
  }
  SELECTS.forEach(s => {
    const st = STATE[sel(s.id)]
    if (st && st.state !== 'off') seq.push({ action:'select.select_option', target:{entity_id:sel(s.id)}, data:{option:st.state} })
  })
  SWITCHES.filter(s=>s.label).forEach(s => {
    const st = STATE[sw(s.id)]
    if (st) seq.push({ action: st.state==='on'?'switch.turn_on':'switch.turn_off', target:{entity_id:sw(s.id)} })
  })
  const payload = { alias: presetConfigs[selectedPreset]?.alias || PRESETS.find(p=>p.id===selectedPreset).name, icon: presetConfigs[selectedPreset]?.icon || 'mdi:snowflake', sequence: seq, mode:'single' }
  try {
    const r = await fetch(WORKER + '/script?id=' + selectedPreset, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    const res = await r.json()
    if (res.ok) { toast('Preset salvato ✓'); selectPreset(selectedPreset) }
    else toast('Errore salvataggio')
  } catch(e) { toast('Errore salvataggio') }
}

// ---- Refresh / polling adattivo ----
let pollTimer = null
async function refresh() {
  const s = await fetchStates()
  if (s) { STATE = s; renderAll(); document.getElementById('conn').textContent = 'aggiornato ' + new Date().toLocaleTimeString('it-IT') }
  else document.getElementById('conn').textContent = 'offline'
}
function scheduleRefresh(delay=800) { setTimeout(refresh, delay) }
function startPolling() { stopPolling(); refresh(); pollTimer = setInterval(refresh, 5000) }
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null }

// polling solo quando la pagina è visibile
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling(); else startPolling()
})

// init
renderPresetTabs()
startPolling()
</script>
</body>
</html>
